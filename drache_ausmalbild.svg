<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="500" height="500">
  <!-- Ein niedlicher Baby-Drache als Ausmalbild -->
  
  <!-- Körper -->
  <ellipse cx="250" cy="300" rx="80" ry="60" fill="none" stroke="black" stroke-width="4"/>
  
  <!-- Kopf -->
  <circle cx="250" cy="200" r="55" fill="none" stroke="black" stroke-width="4"/>
  
  <!-- Hörner -->
  <path d="M215 160 L200 110 L225 150" fill="none" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  <path d="M285 160 L300 110 L275 150" fill="none" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Augen -->
  <circle cx="230" cy="190" r="10" fill="none" stroke="black" stroke-width="3"/>
  <circle cx="270" cy="190" r="10" fill="none" stroke="black" stroke-width="3"/>
  <!-- Pupillen -->
  <circle cx="232" cy="190" r="4" fill="black"/>
  <circle cx="272" cy="190" r="4" fill="black"/>
  
  <!-- Nasenlöcher -->
  <circle cx="245" cy="215" r="3" fill="black"/>
  <circle cx="255" cy="215" r="3" fill="black"/>
  
  <!-- Lächeln -->
  <path d="M235 225 Q250 240 265 225" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Bauch -->
  <ellipse cx="250" cy="310" rx="50" ry="35" fill="none" stroke="black" stroke-width="3"/>
  
  <!-- Flügel (links) -->
  <path d="M175 260 L120 200 L140 250 L100 230 L130 280 L90 270 L140 310 L175 300" fill="none" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Flügel (rechts) -->
  <path d="M325 260 L380 200 L360 250 L400 230 L370 280 L410 270 L360 310 L325 300" fill="none" stroke="black" stroke-width="4" stroke-linejoin="round"/>
  
  <!-- Flügel-Innenlinien -->
  <path d="M160 250 L140 240" fill="none" stroke="black" stroke-width="2"/>
  <path d="M150 270 L130 265" fill="none" stroke="black" stroke-width="2"/>
  <path d="M340 250 L360 240" fill="none" stroke="black" stroke-width="2"/>
  <path d="M350 270 L370 265" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Arme -->
  <path d="M190 290 L160 340 L155 350" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M310 290 L340 340 L345 350" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Beine -->
  <path d="M210 350 L200 420 L195 430" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M290 350 L300 420 L305 430" fill="none" stroke="black" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Füße/Krallen -->
  <path d="M195 430 L185 440 M195 430 L195 442 M195 430 L205 440" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  <path d="M305 430 L295 440 M305 430 L305 442 M305 430 L315 440" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Schwanz -->
  <path d="M250 360 Q280 380 300 370 Q330 350 350 370 Q370 390 360 410" fill="none" stroke="black" stroke-width="4" stroke-linecap="round"/>
  <!-- Schwanzspitze (Pfeil) -->
  <path d="M360 410 L350 400 M360 410 L370 405 M360 410 L365 420" fill="none" stroke="black" stroke-width="3" stroke-linecap="round"/>
  
  <!-- Schuppen auf dem Rücken -->
  <path d="M200 280 L195 270 L210 275" fill="none" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M300 280 L305 270 L290 275" fill="none" stroke="black" stroke-width="2.5" stroke-linejoin="round"/>
  
  <!-- Kleine Flammen aus dem Mund -->
  <path d="M265 220 Q280 215 290 210 Q285 220 295 218" fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Bodenlinie -->
  <path d="M80 440 L420 440" fill="none" stroke="black" stroke-width="3"/>
  <path d="M100 445 L400 445" fill="none" stroke="black" stroke-width="2"/>
  
  <!-- Sterne/Glitzer -->
  <text x="80" y="100" font-size="20" fill="black" stroke="none">✦</text>
  <text x="400" y="80" font-size="16" fill="black" stroke="none">✦</text>
  <text x="420" y="150" font-size="12" fill="black" stroke="none">✦</text>
  <text x="60" y="180" font-size="14" fill="black" stroke="none">✦</text>
</svg>
